# Weekly update proposals (security fixes arrive as soon as they're published).
# Each proposal is a PR that CI checks; merge it when green. Major versions are skipped —
# they need a person to read the changelog (e.g. react-konva must match Next's React).
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /apps/plan-engine
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/plan-engine]
    schedule: { interval: monthly }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
