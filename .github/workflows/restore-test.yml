name: Backup restore test

# Once a month: restore the database backup into a temporary server, check it, delete it again.
# Proves the backups can actually be used. Also runnable by hand (Run workflow).
on:
  schedule:
    - cron: '17 3 1 * *' # 1st of each month, 03:17 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  restore:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: bash infra/azure/restore-test.sh
