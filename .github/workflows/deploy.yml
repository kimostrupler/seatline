name: Deploy

# Deploys main to Azure after CI passed. Inactive until infra/azure/setup.sh was run and its
# five repository variables (AZURE_*) were added in GitHub → Settings → Variables.
# The branch "staging" deploys to the test copy instead (STAGING_RESOURCE_GROUP and
# STAGING_REGISTRY, see setup.sh); without those variables staging isn't deployed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:

permissions:
  id-token: write # sign in to Azure with OpenID Connect (no stored passwords)
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      ((github.event.workflow_run.head_branch || github.ref_name) != 'staging' || vars.STAGING_RESOURCE_GROUP != '')
    runs-on: ubuntu-latest
    env:
      STAGING: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'staging' }}
      RG: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'staging' && vars.STAGING_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP }}
      REGISTRY: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'staging' && vars.STAGING_REGISTRY || vars.AZURE_REGISTRY }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az acr login -n "$REGISTRY"
          SERVER=$(az acr show -n "$REGISTRY" --query loginServer -o tsv)
          API_IMAGE="$SERVER/seatline-api:$SHA"
          WEB_IMAGE="$SERVER/seatline-web:$SHA"
          ENGINE_IMAGE="$SERVER/seatline-plan-engine:$SHA"
          # all three at once; each reuses the unchanged layers of the last build (kept in the
          # registry as <image>:buildcache), so only what changed is rebuilt
          docker buildx create --use --driver docker-container >/dev/null
          build() {
            local cache="$SERVER/$1:buildcache"
            docker buildx build -f "$2" -t "$3" --push --provenance=false --progress=plain \
              --cache-from "type=registry,ref=$cache" \
              --cache-to "type=registry,ref=$cache,mode=max,image-manifest=true,oci-mediatypes=true" \
              . > "/tmp/$1.log" 2>&1
          }
          build seatline-api apps/api/Dockerfile "$API_IMAGE" & api=$!
          build seatline-web apps/web/Dockerfile "$WEB_IMAGE" & web=$!
          build seatline-plan-engine apps/plan-engine/Dockerfile "$ENGINE_IMAGE" & engine=$!
          failed=0
          for job in "api $api" "web $web" "plan-engine $engine"; do
            set -- $job
            if wait "$2"; then echo "::group::$1 (built)"; else failed=1; echo "::group::$1 (FAILED)"; fi
            cat "/tmp/seatline-$1.log"
            echo "::endgroup::"
          done
          [ "$failed" = 0 ]
          {
            echo "API_IMAGE=$API_IMAGE"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "ENGINE_IMAGE=$ENGINE_IMAGE"
          } >> "$GITHUB_ENV"

      - name: Migrate the database
        run: |
          az containerapp job update -n migrate -g "$RG" --image "$API_IMAGE" -o none
          RUN=$(az containerapp job start -n migrate -g "$RG" --query name -o tsv)
          echo "Migration run: $RUN"
          for _ in $(seq 1 60); do
            STATUS=$(az containerapp job execution show -n migrate -g "$RG" --job-execution-name "$RUN" --query properties.status -o tsv)
            echo "  $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::Database migration failed — see the 'migrate' job logs in Azure"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Database migration timed out"
          exit 1

      - name: Update the apps
        env:
          # GitHub variable KEEP_WARM: "true" keeps one copy of the web app and the API running
          # (no wake-up wait, ~CHF 10–20/month more), "web" only the web app (pages appear at
          # once, the first data still waits a few seconds; about half the cost); otherwise
          # both sleep when nobody uses them.
          MIN_REPLICAS: ${{ vars.KEEP_WARM == 'true' && '1' || '0' }}
          WEB_MIN_REPLICAS: ${{ (vars.KEEP_WARM == 'true' || vars.KEEP_WARM == 'web') && '1' || '0' }}
        run: |
          bash infra/azure/plan-engine.sh "$ENGINE_IMAGE"
          az containerapp update -n api -g "$RG" --image "$API_IMAGE" --min-replicas "$MIN_REPLICAS" -o none
          az containerapp update -n web -g "$RG" --image "$WEB_IMAGE" --min-replicas "$WEB_MIN_REPLICAS" -o none
          az containerapp job update -n nightly-sync -g "$RG" --image "$API_IMAGE" -o none

      - name: Error alerts by e-mail
        if: vars.ALERT_EMAIL != '' && env.STAGING != 'true'
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        # an alert problem must not block a release: warn instead
        run: bash infra/azure/alerts.sh || echo "::warning::Could not set up the error alert — see the log above"

      - name: Uptime check
        if: vars.ALERT_EMAIL != '' && env.STAGING != 'true'
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: bash infra/azure/uptime.sh || echo "::warning::Could not set up the uptime check — see the log above"

      - name: Check the site answers
        run: |
          URL="https://$(az containerapp show -n web -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$URL/signin"; then echo "Live: $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::$URL/signin did not answer"
          exit 1

      - name: Tell search engines about the website (IndexNow)
        if: env.STAGING != 'true'
        # Bing & co. learn about new or changed pages at once; a failure never blocks a release
        run: bash infra/azure/indexnow.sh || echo "::warning::IndexNow ping failed — see the log above"
