name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatline
          POSTGRES_PASSWORD: seatline
          POSTGRES_DB: seatline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seatline" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://seatline:seatline@localhost:5432/seatline_test
      TEST_APP_DATABASE_URL: postgresql://seatline_app:seatline_app@localhost:5432/seatline_test
      E2E_DATABASE_URL: postgresql://seatline:seatline@localhost:5432/seatline_e2e
      E2E_APP_DATABASE_URL: postgresql://seatline_app:seatline_app@localhost:5432/seatline_e2e
      APP_DATABASE_URL: postgresql://seatline_app:seatline_app@localhost:5432/seatline_test
      DATABASE_URL: postgresql://seatline:seatline@localhost:5432/seatline_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/plan-engine/requirements*.txt
      - name: Install the plan engine (Python + OCR)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu tesseract-ocr-fra
          pip install -r apps/plan-engine/requirements-dev.txt
      - name: Create the API role and e2e database (same as infra/postgres/init.sql)
        run: |
          psql postgresql://seatline:seatline@localhost:5432/seatline_test -c "CREATE ROLE seatline_app LOGIN PASSWORD 'seatline_app'"
          psql postgresql://seatline:seatline@localhost:5432/seatline_test -c "CREATE DATABASE seatline_e2e"
      - name: Install Chromium for the browser tests
        run: pnpm --filter @seatline/web exec playwright install --with-deps chromium
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
